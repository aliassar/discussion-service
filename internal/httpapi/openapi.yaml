openapi: 3.0.3
info:
  title: Discussion API
  version: "1.0.0"
  description: |
    Posts, comments nested to any depth, and likes.

    There is no authentication, so the acting user is passed explicitly: in the
    body for writes (`author_id`) and in the path for likes (`userID`).

servers:
  - url: http://localhost:8080

tags:
  - name: posts
  - name: comments
  - name: likes

paths:
  /v1/posts:
    post:
      tags: [posts]
      summary: Create a post
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: Path of the new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "200":
          description: |
            A repeat of an earlier request with the same `Idempotency-Key`.
            The body is the post created the first time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/posts/{postID}:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      tags: [posts]
      summary: Read a post with a page of its comment tree
      description: |
        Top-level comments are paged. Each one arrives with its replies, nested
        as deep as they go unless `max_depth` says otherwise.

        Follow `comments_page.next_cursor` for the next page, and stop when
        `comments_page.has_more` is false.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MaxDepth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/posts/{postID}/engagement:
    parameters:
      - $ref: "#/components/parameters/PostID"
    get:
      tags: [posts]
      summary: Engagement summary for a thread
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/posts/{postID}/comments:
    parameters:
      - $ref: "#/components/parameters/PostID"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [comments]
      summary: Comment on a post, or reply to a comment
      description: |
        Leave `parent_id` out to comment on the post. Set it to reply to another
        comment, which must be on the same post. Replies nest to any depth.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewComment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "200":
          description: A repeat of an earlier request with the same `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The post, or the parent comment, does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/posts/{postID}/likes/{userID}:
    parameters:
      - $ref: "#/components/parameters/PostID"
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [likes]
      summary: Like a post
      description: Idempotent. A user's like on a post either exists or it does not.
      responses:
        "204": { description: The like exists }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [likes]
      summary: Remove a like from a post
      description: Idempotent. Removing a like that is not there succeeds.
      responses:
        "204": { description: The like is gone }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/comments/{commentID}/likes/{userID}:
    parameters:
      - $ref: "#/components/parameters/CommentID"
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [likes]
      summary: Like a comment
      responses:
        "204": { description: The like exists }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [likes]
      summary: Remove a like from a comment
      responses:
        "204": { description: The like is gone }
        "404": { $ref: "#/components/responses/NotFound" }

  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: The service is up }

components:
  parameters:
    PostID:
      name: postID
      in: path
      required: true
      schema: { type: string }
    CommentID:
      name: commentID
      in: path
      required: true
      schema: { type: string }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string }
      description: The user giving or removing the like.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: How many top-level comments to return.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: |
        `next_cursor` from the previous page. Leave it out for the first page.
        Treat the value as opaque.
    MaxDepth:
      name: max_depth
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
      description: |
        How deep to include replies, where 1 is top-level comments only. 0, the
        default, includes them all. A comment whose replies were left out still
        reports `reply_count`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: |
        Optional. A repeat of a create with the same key returns the record made
        the first time, with status 200 instead of 201.

  responses:
    BadRequest:
      description: The request body or a field in it is not usable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The post or comment does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is over 1 MiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    NewPost:
      type: object
      required: [author_id, title, body]
      properties:
        author_id: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 10000 }
      example:
        author_id: alice
        title: Hello
        body: First post

    NewComment:
      type: object
      required: [author_id, body]
      properties:
        author_id: { type: string, maxLength: 64 }
        body: { type: string, maxLength: 10000 }
        parent_id:
          type: string
          nullable: true
          description: The comment being replied to. Must be on the same post.
      example:
        author_id: bob
        body: Nice one

    Post:
      type: object
      required: [id, author_id, title, body, created_at]
      properties:
        id: { type: string }
        author_id: { type: string }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    Comment:
      type: object
      required: [id, post_id, parent_id, author_id, body, created_at]
      properties:
        id: { type: string }
        post_id: { type: string }
        parent_id: { type: string, nullable: true }
        author_id: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    CommentNode:
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [likes, replies]
          properties:
            likes: { type: integer, description: Likes on this comment }
            reply_count:
              type: integer
              description: |
                Direct replies this comment has. When it is larger than the
                length of `replies`, the rest were left out by `max_depth`.
            replies:
              type: array
              description: Direct replies, oldest first. Nests to any depth.
              items: { $ref: "#/components/schemas/CommentNode" }

    PostView:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          required: [likes, comments, comments_page]
          properties:
            likes: { type: integer, description: Likes on the post itself }
            comments:
              type: array
              description: This page of top-level comments, oldest first.
              items: { $ref: "#/components/schemas/CommentNode" }
            comments_page: { $ref: "#/components/schemas/PageInfo" }

    PageInfo:
      type: object
      required: [limit, has_more, total_top_level_comments]
      properties:
        limit:
          type: integer
          description: The page size actually used.
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
        has_more:
          type: boolean
          description: Whether more top-level comments follow this page.
        total_top_level_comments:
          type: integer
          description: Top-level comments on the post, not just on this page.

    Engagement:
      type: object
      description: Covers the whole thread. Paging a read does not narrow it.
      required:
        [
          post_id,
          post_likes,
          comment_likes,
          comment_count,
          distinct_engaged_users,
          comments_by_depth,
          longest_reply_chain,
        ]
      properties:
        post_id: { type: string }
        post_likes:
          type: integer
          description: Likes on the post itself.
        comment_likes:
          type: integer
          description: Likes across every comment in the thread.
        comment_count:
          type: integer
          description: Comments in the thread, at every level.
        distinct_engaged_users:
          type: integer
          description: |
            Users who commented, replied, or liked anything in the thread.
            Writing the post is not an action on it, so the author counts only
            if they also did one of those.
        comments_by_depth:
          type: object
          additionalProperties: { type: integer }
          description: |
            Comment count per nesting level, keyed by level as a string. A
            direct comment on the post is level 1. Empty levels are left out.
          example: { "1": 2, "2": 2, "3": 1 }
        longest_reply_chain:
          type: integer
          description: |
            Comments on the longest path from a top-level comment down to a
            leaf. 0 when the thread has no comments.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  invalid_argument,
                  invalid_json,
                  not_found,
                  payload_too_large,
                  unsupported_media_type,
                  internal,
                ]
            message: { type: string }
            request_id:
              type: string
              description: Matches the X-Request-Id response header.
      example:
        error:
          code: not_found
          message: 'post "nope": not found'
          request_id: 8f14e45fceea167a
